<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jiggle.js — Crystal</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #info {
            position: fixed; top: 1rem; left: 1rem;
            color: #6e7681; font-family: monospace; font-size: 0.75rem;
            pointer-events: none;
        }
        #info strong { color: #58a6ff; }
        a.back { position: fixed; top: 1rem; right: 1rem; font-family: monospace;
                 font-size: 0.75rem; color: #6e7681; text-decoration: none; }
        a.back:hover { color: #58a6ff; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
    <strong>Crystal</strong> — argon, T = <span id="temp">–</span> K<br>
    <span id="fps"></span>
</div>
<a class="back" href="index.html">← demos</a>

<script type="module">
import { Simulation, ThermalForce, LJForce, CanvasRenderer, PeriodicBoundary, SimulationClock }
    from '../src/index.js';
import { fullscreenCanvas, statsOverlay } from './demo.js';

const { canvas, dpr } = fullscreenCanvas();

// ── Parameters ────────────────────────────────────────────────────────
const SIGMA   = 3.4;                          // Å — argon LJ diameter
const SPACING = Math.pow(2, 1/6) * SIGMA;    // ≈ 3.82 Å — energy minimum
const COLS = 22, ROWS = 17;
const simW = COLS * SPACING;
const simH = ROWS * SPACING;

// ── Simulation ────────────────────────────────────────────────────────
const sim = Simulation.fromGrid(COLS, ROWS, {
    spacing:        SPACING,
    particleRadius: SIGMA * 0.5,
    species:        'Ar',
    width:          simW,
    height:         simH,
    boundary:       new PeriodicBoundary(),
});
sim.dt = 0.5;   // fs — small step for stability at high density

const lj      = new LJForce({ species: { Ar: { epsilon: 0.238, sigma: SIGMA } }, cutoff: 12 });
const thermal = new ThermalForce({ temperature: 10, gamma: 0.05 });
sim.addForce(lj).addForce(thermal);

// ── Renderer ──────────────────────────────────────────────────────────
const scale = Math.min(window.innerWidth / simW, window.innerHeight / simH) * 0.92;
const renderer = new CanvasRenderer(canvas, {
    dpr,
    scale,
    dotColor:  'rgba(80,180,220,',
    lineColor: 'rgba(80,180,220,',
    linkDist:  SPACING * 1.25,   // show nearest-neighbour bonds only
    boxColor:  'rgba(255,255,255,0.12)',
});
// Centre the box in the viewport
renderer.viewX = simW / 2 - window.innerWidth  / (2 * scale);
renderer.viewY = simH / 2 - window.innerHeight / (2 * scale);

// ── Loop ──────────────────────────────────────────────────────────────
const fpsEl  = document.getElementById('fps');
const tempEl = document.getElementById('temp');
const stats = statsOverlay({ fpsEl, tempEl });
const clock = new SimulationClock({ stepsPerSecond: 240 });

function loop(now) {
    const steps = clock.tick(now);
    for (let i = 0; i < steps; i++) sim.step();
    renderer.render(sim.store, { x: null, y: null }, sim);
    stats.frame(now, sim);
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
    const s = Math.min(window.innerWidth / simW, window.innerHeight / simH) * 0.92;
    renderer.scale = s;
    renderer.viewX = simW / 2 - window.innerWidth  / (2 * s);
    renderer.viewY = simH / 2 - window.innerHeight / (2 * s);
});
</script>
</body>
</html>
